<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cavaleiro de Luz e a Máscara de Oxigênio | Boralutar</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google: Foco total no Brutalismo (Sem Serifa + Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-ui);
            background-color: #09090b; /* zinc-950 - Asfalto Escuro */
            color: #d4d4d8; /* zinc-300 - Concreto Claro */
        }

        .font-tech { font-family: var(--font-tech); }

        /* Seleção de texto: Amarelo Máscara de Oxigênio */
        ::selection {
            background-color: #eab308; /* yellow-500 */
            color: #000000;
        }
        
        /* Efeito Faded Neon */
        .neon-glow-yellow {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.4);
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L54EQJ2N41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());

      gtag("config", "G-L54EQJ2N41");
    </script>

</head>
<body class="relative min-h-screen pb-24 selection:bg-yellow-500 selection:text-black">
    {{ content }}
    </body>
</html>
