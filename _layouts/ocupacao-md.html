---
layout: ocupacao
---

<div class="max-w-3xl mx-auto px-6 py-16 w-full">
    
    <!-- Cabeçalho (Puxa os dados do YAML) -->
    <header class="mb-10">
        <h1 class="font-ui font-black text-4xl md:text-5xl text-white uppercase tracking-tighter">
            {{ page.title_part1 | default: page.title }} 
            {% if page.title_highlight %}
            <br><span class="text-red-600">{{ page.title_highlight }}</span>
            {% endif %}
        </h1>
    </header>

    <!-- O Miolo (Aqui o Jekyll injeta os parágrafos do seu texto) -->
    <div class="conteudo-literario font-story text-xl text-zinc-300 leading-relaxed">
        {{ content }}
    </div>
    
    <!-- Botão de Retorno Automático -->
    <a href="{{ page.back_link | default: '/zumbiedandara/' }}" class="inline-block mt-12 font-tech text-red-500 hover:text-red-400 font-bold uppercase tracking-wider">
        &larr; Voltar
    </a>

</div>

<!-- CSS para espaçar os parágrafos gerados automaticamente pelo Markdown -->
<style>
    .conteudo-literario p {
        margin-bottom: 1.5rem;
    }
</style>
