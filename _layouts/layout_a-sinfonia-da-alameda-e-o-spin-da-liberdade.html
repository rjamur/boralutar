<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Sinfonia da Alameda e o Spin da Liberdade | Boralutar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --font-story: 'Lora', serif;
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-story);
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        .font-ui { font-family: var(--font-ui); }
        .font-tech { font-family: var(--font-tech); }

        ::selection {
            background-color: #f59e0b; /* amber-500 */
            color: #18181b;
        }
        
        .glow-amber { box-shadow: 0 0 25px rgba(245, 158, 11, 0.15); }
        .glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.15); }
        .glow-purple { box-shadow: 0 0 30px rgba(168, 85, 247, 0.15); }
    </style>
