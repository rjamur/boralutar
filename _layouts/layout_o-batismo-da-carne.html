<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Criptografado | Boralutar</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-story: 'Lora', serif;
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-story);
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        .font-ui { font-family: var(--font-ui); }
        .font-tech { font-family: var(--font-tech); }

        ::selection {
            background-color: #ef4444; /* red-500 */
            color: #ffffff;
        }
        
        /* Terminal Glows */
        .glow-red { box-shadow: 0 0 25px rgba(220, 38, 38, 0.15); }
        .glow-gold { box-shadow: 0 0 25px rgba(234, 179, 8, 0.15); }
        .glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.15); }

        /* Animação de Fade-in para o conteúdo */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        
        /* Cursor piscante do input */
        .blink-caret {
            animation: blink-caret 1s step-end infinite;
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #10b981; }
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L54EQJ2N41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());

      gtag("config", "G-L54EQJ2N41");
    </script>

</head>
<body class="relative min-h-screen selection:bg-red-500 selection:text-white flex flex-col">
    {{ content }}
    </body>
</html>
