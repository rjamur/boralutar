<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Aerodinâmica da Graça e a Vertigem da Liberdade | Boralutar</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-story: 'Lora', serif;
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-story);
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        .font-ui { font-family: var(--font-ui); }
        .font-tech { font-family: var(--font-tech); }

        ::selection {
            background-color: #3b82f6; /* blue-500 */
            color: #ffffff;
        }
        
        /* Terminal Glows Palette for the 10 Cuts */
        .glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.15); }
        .glow-red { box-shadow: 0 0 25px rgba(220, 38, 38, 0.15); }
        .glow-white { box-shadow: 0 0 25px rgba(255, 255, 255, 0.1); }
        .glow-amber { box-shadow: 0 0 25px rgba(245, 158, 11, 0.15); }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.15); }
        .glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.15); }
        .glow-slate { box-shadow: 0 0 25px rgba(100, 116, 139, 0.2); }
        .glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.15); }
        .glow-zinc { box-shadow: 0 0 25px rgba(63, 63, 70, 0.3); }
        .glow-gold { box-shadow: 0 0 30px rgba(234, 179, 8, 0.2); }
    </style>
</head>
<body class="relative min-h-screen pb-24 selection:bg-blue-500 selection:text-white">
    {{ content }}
    </body>
</html>
