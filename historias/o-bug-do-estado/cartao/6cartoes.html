<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cartões O Bug do Estado - 6 por Folha A4</title>
    <style>
        /* Configuração exata para impressão A4 e remoção de margens */
        @page {
            size: A4 portrait;
            margin: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* O container que simula a folha A4 perfeita */
        .folha-a4 {
            width: 210mm;
            height: 297mm;
            display: grid;
            /* 2 colunas de 105mm, 3 linhas de 99mm (Total: 210x297) */
            grid-template-columns: 105mm 105mm;
            grid-template-rows: 99mm 99mm 99mm;
            background: white;
        }

        /* Estrutura individual do cartão (agora no formato paisagem interno) */
        .cartao {
            box-sizing: border-box;
            border-right: 1px dashed #aaaaaa;
            border-bottom: 1px dashed #aaaaaa;
            padding: 6mm 8mm;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 4mm;
        }

        /* Remove bordas duplas nas extremidades para o corte com tesoura ficar perfeito */
        .cartao:nth-child(2n) {
            border-right: none;
        }
        .cartao:nth-child(5), .cartao:nth-child(6) {
            border-bottom: none;
        }

        /* Coluna da esquerda (Textos) */
        .bloco-texto {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 58%;
        }

        /* Coluna da direita (QR Code) */
        .bloco-qr {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 38%;
            text-align: center;
        }

        .alerta {
            background-color: #000000;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 11px;
            padding: 3px 5px;
            letter-spacing: 1px;
            margin-bottom: 6px;
            align-self: flex-start;
        }

        .titulo {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.1;
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }

        .texto {
            font-size: 12px;
            line-height: 1.3;
            margin: 0;
            font-weight: bold;
            color: #222222;
        }

        .instrucao-texto {
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 4px;
            line-height: 1.1;
        }

        .qr-image {
            width: 33mm;
            height: 33mm;
            image-rendering: pixelated; 
            border: 2px solid #000;
            padding: 2px;
            border-radius: 4px;
        }

        .rodape {
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
            margin-top: 6px;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
            }
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L54EQJ2N41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());

      gtag("config", "G-L54EQJ2N41");
    </script>
</head>
<body>

    <div class="folha-a4">
        
        <!-- Script para replicar o cartão 6 vezes sem sujar o HTML repetindo código -->
        <script>
            const cartaoHTML = `
                <div class="cartao">
                    <div class="bloco-texto">
                        <div class="alerta">Curitiba - PR</div>
                        <h1 class="titulo">O BUG DO<br>ESTADO</h1>
                        <p class="texto">Trancaram meu portão. Roubaram minha casa. Quando chamei a PM, o Estado lavou as mãos.</p>
                        <div class="rodape">boralutar.com.br</div>
                    </div>
                    <div class="bloco-qr">
                        <div class="instrucao-texto">📷 APONTE A<br>CÂMERA</div>
                        <img src="qrcode_boralutar.com.br.png" alt="QR Code" class="qr-image">
                    </div>
                </div>
            `;
            // Injeta 6 cartões no grid
            for(let i=0; i<6; i++) {
                document.write(cartaoHTML);
            }
        </script>

    </div>

</body>
</html>
