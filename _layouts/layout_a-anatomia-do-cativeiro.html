            -moz-osx-font-smoothing: grayscale;
        }
        
        .msg-evidence {
            background-image: repeating-linear-gradient(45deg, #18181b 25%, transparent 25%, transparent 75%, #18181b 75%, #18181b), repeating-linear-gradient(45deg, #18181b 25%, #09090b 25%, #09090b 75%, #18181b 75%, #18181b);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
