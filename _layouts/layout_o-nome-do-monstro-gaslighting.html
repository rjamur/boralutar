<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Ponto Cego e o Nome do Monstro | Boralutar</title>
    
    <!-- Tailwind CSS via CDN para prototipagem rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Lora (Narrativa), Inter (Interface), Space Mono (Cortes Documentais) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Configuração de Fontes e ajustes finos */
        :root {
            --font-story: 'Lora', serif;
            --font-ui: 'Inter', sans-serif;
            --font-tech: 'Space Mono', monospace;
        }
        
        body {
            font-family: var(--font-story);
            background-color: #09090b; /* zinc-950 */
            color: #d4d4d8; /* zinc-300 */
        }

        .font-ui { font-family: var(--font-ui); }
        .font-tech { font-family: var(--font-tech); }

        /* Estilização da seleção de texto (Brutalista) */
        ::selection {
            background-color: #dc2626; /* red-600 */
            color: #ffffff;
        }

        /* Suavização de renderização */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L54EQJ2N41"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());

      gtag("config", "G-L54EQJ2N41");
    </script>
</head>
<body class="relative min-h-screen pb-24">
    {{ content }}
    </body>
</html>
